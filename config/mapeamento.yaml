# FuelBridge PT-BR - mapeamento de combustiveis entre DGEG (PT) e ANP (BR)
# Cada documento YAML (separado por ---) e lido como uma linha pelo step YAML Input do Pentaho.
# Usado na t_comparacao para dar um codigo comum aos combustiveis dos dois paises.
# comparavel: N = o combustivel so existe num dos paises e fica fora da comparacao.
# preco_min_eur / preco_max_eur = limites de validacao do preco final em euros.
